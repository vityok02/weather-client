<div class="bg-white bg-opacity-50 rounded-md p-4 shadow">
  <h3 class="text-xl font-semibold mb-4 text-center">Today’s Forecast</h3>

  <div class="grid grid-cols-2 gap-4 text-center">
    <div class="bg-white bg-opacity-70 rounded-md p-3 shadow-sm">
      <p class="text-sm text-gray-600">Max / Min</p>
      <p class="text-lg font-semibold">
        {{ forecast.maxtemp_c }}° / {{ forecast.mintemp_c }}°
      </p>
    </div>

    <div class="bg-white bg-opacity-70 rounded-md p-3 shadow-sm">
      <p class="text-sm text-gray-600">Avg Temp</p>
      <p class="text-lg font-semibold">{{ forecast.avgtemp_c }}°</p>
    </div>

    <div class="bg-white bg-opacity-70 rounded-md p-3 shadow-sm">
      <p class="text-sm text-gray-600">Chance of Rain</p>
      <p class="text-lg font-semibold text-blue-600">
        {{ forecast.daily_chance_of_rain }}%
      </p>
    </div>

    <div class="bg-white bg-opacity-70 rounded-md p-3 shadow-sm">
      <p class="text-sm text-gray-600">Avg Humidity</p>
      <p class="text-lg font-semibold">{{ forecast.avghumidity }}%</p>
    </div>

    <div class="bg-white bg-opacity-70 rounded-md p-3 shadow-sm col-span-2">
      <p class="text-sm text-gray-600">Max Wind</p>
      <p class="text-lg font-semibold">{{ forecast.maxwind_kph }} km/h</p>
    </div>
  </div>
</div>
